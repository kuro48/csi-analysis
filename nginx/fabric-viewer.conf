events { worker_connections 256; }
http {
    server_tokens off;
    access_log off;
    limit_req_zone $binary_remote_addr zone=verification:10m rate=2r/s;
    limit_req_status 429;
    upstream fabric_api { server host.docker.internal:8015; }
    upstream fabric_ui { server host.docker.internal:3015; }
    server {
        listen 80;
        client_max_body_size 4k;
        client_body_timeout 10s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # Exact read/verify allowlist. No patient creation, ingestion, retries, or debug APIs.
        location = /api/v2/observations/patients {
            limit_except GET { deny all; }
            limit_req zone=verification burst=10 nodelay;
            proxy_pass http://fabric_api;
            add_header Cache-Control "no-store" always;
        }
        location ~ "^/api/v2/observations/patients/[0-9a-f-]{36}/measurements$" {
            limit_except GET { deny all; }
            limit_req zone=verification burst=10 nodelay;
            proxy_pass http://fabric_api;
            add_header Cache-Control "no-store" always;
        }
        location ~ "^/api/v2/observations/measurements/[0-9a-f-]{36}/verify$" {
            limit_except POST { deny all; }
            limit_req zone=verification burst=5 nodelay;
            proxy_read_timeout 90s;
            proxy_pass http://fabric_api;
            add_header Cache-Control "no-store" always;
        }
        location = / {
            limit_except GET { deny all; }
            proxy_pass http://fabric_ui;
        }
        location = /patients {
            limit_except GET { deny all; }
            proxy_pass http://fabric_ui;
        }
        location /_next/static/ {
            limit_except GET { deny all; }
            proxy_pass http://fabric_ui;
        }
        location = /favicon.ico { proxy_pass http://fabric_ui; }
        location / { return 404; }
    }
}
