# Each organization runs this on its OWN Linux host, on a private routed network.
name: csi-peer
services:
  peer:
    image: hyperledger/fabric-peer:2.5.16
    environment:
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: ${PEER_DNS:?Set PEER_DNS}
      CORE_PEER_ADDRESS: ${PEER_DNS}:${PEER_PORT:-7051}
      CORE_PEER_LISTENADDRESS: 0.0.0.0:${PEER_PORT:-7051}
      CORE_PEER_LOCALMSPID: ${MSP_ID:?Set MSP_ID}
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/identity/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/identity/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/identity/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/identity/tls/ca.crt
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: ${PEER_DNS}:${PEER_PORT:-7051}
      CORE_PEER_GOSSIP_BOOTSTRAP: ${PEER_DNS}:${PEER_PORT:-7051}
      CORE_PEER_GOSSIP_USELEADERELECTION: "false"
      CORE_PEER_GOSSIP_ORGLEADER: "true"
      CORE_PEER_CHAINCODEADDRESS: peer:${CHAINCODE_PORT:-7052}
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:${CHAINCODE_PORT:-7052}
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: ${PEER_NETWORK:-csi-peer-runtime}
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      CORE_METRICS_PROVIDER: prometheus
      CORE_LEDGER_STATE_STATEDATABASE: goleveldb
    volumes:
      - ${NODE_IDENTITY_DIR:?Set peer identity directory}:/etc/hyperledger/identity:ro
      - peer_data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    ports:
      - ${PRIVATE_BIND_IP:?Set private host IP}:${PEER_PORT:-7051}:${PEER_PORT:-7051}
      - 127.0.0.1:${PEER_OPERATIONS_PORT:-9443}:9443
    restart: unless-stopped
    # Keep public DNS resolving to the host: a collocated orderer uses that
    # same DNS name on a different port. Chaincode uses the service alias peer.
    networks: [runtime]
networks:
  runtime:
    name: ${PEER_NETWORK:-csi-peer-runtime}
volumes:
  peer_data:
